<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดบัญชี — รายรับรายจ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E3;
    --paper-line:#DED2AE;
    --ink:#20291F;
    --cover:#0F3D26;
    --cover-2:#155232;
    --gold:#C9A227;
    --gold-soft:#E4CD82;
    --income:#2E7A4C;
    --income-bg:#E4F0E4;
    --expense:#B23E2E;
    --expense-bg:#F5E4DF;
    --muted:#79705C;
    --shadow: 0 18px 40px -20px rgba(15,61,38,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #f0ead7 0%, var(--paper) 55%);
    font-family:'Sarabun',sans-serif;
    color:var(--ink);
    padding:32px 16px 80px;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* Cover / masthead */
  .cover{
    background:
      linear-gradient(160deg, var(--cover-2) 0%, var(--cover) 65%);
    border-radius:18px 18px 6px 6px;
    padding:28px 30px 34px;
    color:var(--gold-soft);
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    border:1px solid #0a2e1c;
  }
  .cover::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid rgba(228,205,130,0.35);
    border-radius:12px;
    pointer-events:none;
  }
  .cover-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(228,205,130,0.75); margin-bottom:10px;
  }
  .cover-title{
    font-family:'Noto Serif Thai',serif;
    font-size:clamp(26px,4vw,34px);
    font-weight:700;
    margin:0 0 4px;
    color:#F7EFD3;
  }
  .cover-sub{
    font-size:13.5px; color:rgba(228,205,130,0.8); margin:0;
  }
  .balance-row{
    margin-top:24px;
    display:flex; align-items:flex-end; gap:24px; flex-wrap:wrap;
  }
  .balance-figure{flex:1; min-width:200px;}
  .balance-label{font-size:12px; letter-spacing:.08em; color:rgba(228,205,130,0.7); margin-bottom:6px;}
  .balance-num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:clamp(30px,6vw,46px);
    color:#FBF6E4;
    letter-spacing:.01em;
  }
  .balance-num small{font-size:0.45em; font-weight:500; margin-left:6px; color:rgba(228,205,130,0.7);}

  .stamp{
    width:88px;height:88px;border-radius:50%;
    border:2.5px solid var(--gold-soft);
    display:flex; align-items:center; justify-content:center; text-align:center;
    transform:rotate(-8deg);
    font-family:'Noto Serif Thai',serif; font-weight:700; font-size:12px;
    color:var(--gold-soft); line-height:1.3; letter-spacing:.02em;
    opacity:.9; flex-shrink:0;
  }

  /* Month strip */
  .month-strip{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--paper); border:1px solid var(--paper-line);
    border-top:none; border-radius:0 0 10px 10px;
    padding:10px 20px; margin-bottom:22px; box-shadow:var(--shadow);
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted);
  }
  .month-strip select{
    font-family:'Sarabun',sans-serif; font-size:13.5px; color:var(--ink);
    border:1px solid var(--paper-line); background:#fff; border-radius:7px;
    padding:5px 9px;
  }

  /* Summary cards */
  .summary{
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:26px;
  }
  @media(max-width:640px){.summary{grid-template-columns:1fr 1fr;}}
  .card{
    background:#fff; border:1px solid var(--paper-line); border-radius:12px;
    padding:16px 18px; position:relative; overflow:hidden;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
  .card.income::before{background:var(--income);}
  .card.expense::before{background:var(--expense);}
  .card.net::before{background:var(--gold);}
  .card-label{font-size:12px; color:var(--muted); margin-bottom:6px;}
  .card-value{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:22px;}
  .card.income .card-value{color:var(--income);}
  .card.expense .card-value{color:var(--expense);}
  .card.net .card-value{color:#8a6d0f;}

  /* Add form */
  .panel{
    background:#fff; border:1px solid var(--paper-line); border-radius:14px;
    padding:20px; margin-bottom:26px; box-shadow:0 10px 24px -18px rgba(0,0,0,.25);
  }
  .panel h2{
    font-family:'Noto Serif Thai',serif; font-size:17px; margin:0 0 14px;
    display:flex; align-items:center; gap:8px;
  }
  .type-toggle{display:flex; gap:8px; margin-bottom:14px;}
  .type-btn{
    flex:1; padding:10px; border-radius:9px; border:1.5px solid var(--paper-line);
    background:#fbf8f0; font-weight:600; font-size:14px; cursor:pointer;
    color:var(--muted); transition:.15s;
  }
  .type-btn.active[data-type="income"]{background:var(--income-bg); border-color:var(--income); color:var(--income);}
  .type-btn.active[data-type="expense"]{background:var(--expense-bg); border-color:var(--expense); color:var(--expense);}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; color:var(--muted);}
  .field input, .field select{
    font-family:'Sarabun',sans-serif; font-size:14.5px; padding:9px 10px;
    border:1px solid var(--paper-line); border-radius:8px; background:#fdfbf5;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--gold-soft); outline-offset:1px;}
  .form-actions{margin-top:16px; display:flex; justify-content:flex-end;}
  .btn-submit{
    font-family:'Sarabun',sans-serif; font-weight:600; font-size:14.5px;
    padding:10px 22px; border-radius:9px; border:none; cursor:pointer;
    background:var(--cover); color:#F7EFD3; transition:.15s;
  }
  .btn-submit:hover{background:var(--cover-2);}

  /* Ledger table */
  .ledger-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .ledger-head h2{font-family:'Noto Serif Thai',serif; font-size:17px; margin:0;}
  .btn-ghost{
    font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:var(--muted);
    background:none; border:1px solid var(--paper-line); border-radius:7px;
    padding:6px 10px; cursor:pointer;
  }
  .btn-ghost:hover{border-color:var(--gold); color:#8a6d0f;}

  .ledger{
    background:#fff; border:1px solid var(--paper-line); border-radius:14px; overflow:hidden;
    box-shadow:0 10px 24px -18px rgba(0,0,0,.25);
  }
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-weight:600; font-size:11.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--muted); padding:10px 14px;
    border-bottom:1px solid var(--paper-line); background:#fbf8f0;
  }
  tbody td{padding:11px 14px; border-bottom:1px dashed var(--paper-line); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  .num{font-family:'IBM Plex Mono',monospace; text-align:right; white-space:nowrap;}
  .amt-income{color:var(--income); font-weight:600;}
  .amt-expense{color:var(--expense); font-weight:600;}
  .cat-tag{
    display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:20px;
    background:#f1ecd9; color:var(--muted);
  }
  .desc{font-weight:500;}
  .row-date{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); white-space:nowrap;}
  .del-btn{
    background:none;border:none;color:var(--paper-line);cursor:pointer;font-size:15px;
    transition:.15s; line-height:1;
  }
  .del-btn:hover{color:var(--expense);}
  .empty-row td{
    text-align:center; padding:40px 14px; color:var(--muted); font-size:13.5px;
  }

  footer{text-align:center; font-size:11.5px; color:var(--muted); margin-top:26px; font-family:'IBM Plex Mono',monospace;}
  .loading{text-align:center; padding:60px 0; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:13px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">กำลังเปิดสมุดบัญชี…</div>
</div>

<script>
const STORAGE_KEY = 'ledger_transactions';

const CATEGORIES = {
  income: ['เงินเดือน','โบนัส','ธุรกิจ/ฟรีแลนซ์','ของขวัญ','ดอกเบี้ย/เงินปันผล','อื่นๆ'],
  expense: ['อาหาร & เครื่องดื่ม','เดินทาง','ช้อปปิ้ง','บิล & สาธารณูปโภค','บันเทิง','สุขภาพ','การศึกษา','อื่นๆ']
};

let transactions = [];
let currentType = 'income';
let monthFilter = 'all';

const app = document.getElementById('app');

function fmt(n){
  return Number(n).toLocaleString('th-TH', {minimumFractionDigits:0, maximumFractionDigits:2});
}
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function monthKey(dateStr){
  return dateStr.slice(0,7);
}
function monthLabel(key){
  const [y,m] = key.split('-');
  const thMonths = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${thMonths[parseInt(m,10)]} ${parseInt(y,10)+543}`;
}
function fmtDateShort(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const thMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${d.getDate()} ${thMonths[d.getMonth()]} ${(d.getFullYear()+543).toString().slice(-2)}`;
}

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    transactions = res ? JSON.parse(res.value) : [];
  }catch(e){
    transactions = [];
  }
  render();
}

async function saveData(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(transactions), false);
  }catch(e){
    console.error('บันทึกไม่สำเร็จ', e);
  }
}

function addTransaction(tx){
  transactions.push(tx);
  saveData();
  render();
}

function deleteTransaction(id){
  transactions = transactions.filter(t => t.id !== id);
  saveData();
  render();
}

function getMonthOptions(){
  const keys = Array.from(new Set(transactions.map(t => monthKey(t.date)))).sort().reverse();
  return keys;
}

function computeSummary(list){
  let income = 0, expense = 0;
  list.forEach(t => { if(t.type==='income') income += t.amount; else expense += t.amount; });
  return {income, expense, net: income - expense};
}

function exportCSV(){
  const rows = [['วันที่','ประเภท','รายการ','หมวดหมู่','จำนวนเงิน']];
  [...transactions].sort((a,b)=> a.date.localeCompare(b.date)).forEach(t=>{
    rows.push([t.date, t.type==='income'?'รายรับ':'รายจ่าย', t.desc, t.category, t.amount]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'สมุดบัญชี.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function render(){
  const allTimeTotal = computeSummary(transactions).net;

  const monthOpts = getMonthOptions();
  const filtered = monthFilter === 'all'
    ? transactions
    : transactions.filter(t => monthKey(t.date) === monthFilter);

  const sum = computeSummary(filtered);
  const sortedDesc = [...filtered].sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt - a.createdAt);

  const catOptions = CATEGORIES[currentType].map(c => `<option value="${c}">${c}</option>`).join('');

  app.innerHTML = `
    <div class="cover">
      <div class="cover-eyebrow">เล่มที่ 001 · ส่วนบุคคล</div>
      <h1 class="cover-title">สมุดบัญชีของฉัน</h1>
      <p class="cover-sub">บันทึกรายรับรายจ่ายประจำวัน เก็บทุกบาททุกสตางค์ไว้ในที่เดียว</p>
      <div class="balance-row">
        <div class="balance-figure">
          <div class="balance-label">ยอดคงเหลือทั้งหมด</div>
          <div class="balance-num">฿${fmt(allTimeTotal)}<small>บาท</small></div>
        </div>
        <div class="stamp">${allTimeTotal >= 0 ? 'มีเงินออม' : 'ติดลบ'}<br>${fmt(Math.abs(allTimeTotal))}</div>
      </div>
    </div>

    <div class="month-strip">
      <span>แสดงข้อมูล ${monthFilter==='all' ? 'ทุกเดือน' : monthLabel(monthFilter)} · ${filtered.length} รายการ</span>
      <select id="monthSelect">
        <option value="all" ${monthFilter==='all'?'selected':''}>ทุกเดือน</option>
        ${monthOpts.map(k => `<option value="${k}" ${monthFilter===k?'selected':''}>${monthLabel(k)}</option>`).join('')}
      </select>
    </div>

    <div class="summary">
      <div class="card income">
        <div class="card-label">รายรับ</div>
        <div class="card-value">฿${fmt(sum.income)}</div>
      </div>
      <div class="card expense">
        <div class="card-label">รายจ่าย</div>
        <div class="card-value">฿${fmt(sum.expense)}</div>
      </div>
      <div class="card net">
        <div class="card-label">สุทธิ</div>
        <div class="card-value">฿${fmt(sum.net)}</div>
      </div>
    </div>

    <div class="panel">
      <h2>+ เพิ่มรายการใหม่</h2>
      <div class="type-toggle">
        <button type="button" class="type-btn ${currentType==='income'?'active':''}" data-type="income" id="btnIncome">💰 รายรับ</button>
        <button type="button" class="type-btn ${currentType==='expense'?'active':''}" data-type="expense" id="btnExpense">🧾 รายจ่าย</button>
      </div>
      <form id="txForm">
        <div class="form-grid">
          <div class="field">
            <label>วันที่</label>
            <input type="date" id="fDate" value="${todayStr()}" required>
          </div>
          <div class="field">
            <label>จำนวนเงิน (บาท)</label>
            <input type="number" id="fAmount" min="0" step="0.01" placeholder="0.00" required>
          </div>
          <div class="field">
            <label>รายการ</label>
            <input type="text" id="fDesc" placeholder="เช่น ค่าข้าวเที่ยง" required>
          </div>
          <div class="field">
            <label>หมวดหมู่</label>
            <select id="fCategory">${catOptions}</select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-submit">บันทึกรายการ ✓</button>
        </div>
      </form>
    </div>

    <div class="ledger-head">
      <h2>รายการทั้งหมด</h2>
      <button class="btn-ghost" id="exportBtn">📥 Export CSV</button>
    </div>
    <div class="ledger">
      <table>
        <thead>
          <tr>
            <th>วันที่</th><th>รายการ</th><th>หมวดหมู่</th><th style="text-align:right">รายรับ</th><th style="text-align:right">รายจ่าย</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${sortedDesc.length === 0 ? `
            <tr class="empty-row"><td colspan="6">ยังไม่มีรายการ — เริ่มบันทึกรายการแรกของคุณด้านบนได้เลย 📝</td></tr>
          ` : sortedDesc.map(t => `
            <tr>
              <td class="row-date">${fmtDateShort(t.date)}</td>
              <td class="desc">${escapeHtml(t.desc)}</td>
              <td><span class="cat-tag">${escapeHtml(t.category)}</span></td>
              <td class="num amt-income">${t.type==='income' ? '฿'+fmt(t.amount) : ''}</td>
              <td class="num amt-expense">${t.type==='expense' ? '฿'+fmt(t.amount) : ''}</td>
              <td class="num"><button class="del-btn" data-id="${t.id}" title="ลบรายการ">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    <footer>สมุดบัญชี · ข้อมูลถูกบันทึกไว้ในเบราว์เซอร์นี้เท่านั้น</footer>
  `;

  attachEvents();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function attachEvents(){
  document.getElementById('btnIncome').onclick = () => { currentType='income'; render(); };
  document.getElementById('btnExpense').onclick = () => { currentType='expense'; render(); };
  document.getElementById('monthSelect').onchange = (e) => { monthFilter = e.target.value; render(); };
  document.getElementById('exportBtn').onclick = exportCSV;

  document.getElementById('txForm').onsubmit = (e) => {
    e.preventDefault();
    const date = document.getElementById('fDate').value;
    const amount = parseFloat(document.getElementById('fAmount').value);
    const desc = document.getElementById('fDesc').value.trim();
    const category = document.getElementById('fCategory').value;
    if(!date || !amount || amount <= 0 || !desc) return;
    addTransaction({
      id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      type: currentType,
      date, amount, desc, category,
      createdAt: Date.now()
    });
  };

  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.onclick = () => deleteTransaction(btn.dataset.id);
  });
}

loadData();
</script>
</body>
</html>
